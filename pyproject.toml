[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lookalike-domain-detector"
dynamic = ["version"]
description = "Flags newly registered domains that imitate protected brands."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
# Add [project.scripts] when cli.py exists.

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.dynamic]
version = { attr = "lookalike.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lookalike = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.report]
show_missing = true
exclude_also = [
    'if __name__ == .__main__.:',
    '\.\.\.',
]
